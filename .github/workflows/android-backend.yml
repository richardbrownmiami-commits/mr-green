name: Android backend AAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-aar:
    name: Build ARMv7 backend AAR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          sdkmanager --list_installed

      - name: Fetch pinned native dependencies
        run: |
          chmod +x gradlew scripts/fetch-llama.sh scripts/fetch-quickjs.sh
          ./scripts/fetch-llama.sh
          ./scripts/fetch-quickjs.sh

      - name: Build backend AAR
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify AAR output
        run: |
          test -s app/build/outputs/aar/app-debug.aar
          ls -lh app/build/outputs/aar/app-debug.aar

      - name: Upload backend AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mr-green-backend-debug-aar
          path: app/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mr-green-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            **/build/tmp/**/*.log
          if-no-files-found: ignore
          retention-days: 7
